# ShadowSurf CI：类型检查 / 单元测试 / Windows 安装包
#
# 触发：
#   · push 到 main、任意 PR、手动 dispatch → Ubuntu 上跑 check
#   · push v* 标签 → 额外产出 Windows x64 安装包 + 便携版，并创建 Release
#
# 为什么验收放 Ubuntu、打包放 windows-latest：
#   · 单测 / 构建是纯 Node，Ubuntu 更快更便宜；
#   · NSIS 打包必须在 Windows 上跑（electron-builder 的 winCodeSign / 7z 链路），
#     且 electron-builder.yml 里 win.icon 用的是 .ico —— 跨平台交叉打包会多一层不可信。
#
# 注意：安装包未做代码签名，SmartScreen 会提示「未知发布者」。这是没有 EV 证书的
# 必然结果；不要为了消提示往流水线里塞自签名证书 —— 那只会让告警看起来更可疑。

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      # test:gate 会断言构建产物必须是新的（SS_REQUIRE_FRESH_BUILD=1），
      # 所以 build 必须在测试之前。两者顺序反了，那条断言会静默 skip。
      - name: Build
        run: npm run build

      - name: Unit tests (gate mode)
        run: npm run test:gate

  windows:
    name: Windows x64 installer
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # 没有证书时不要让 electron-builder 去找开发者证书（会多一轮无意义的重试）
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dist:win = build + electron-builder --win --x64
      # 产物：release/ShadowSurf-<version>-win-x64-setup.exe / -portable.exe
      - name: Package (NSIS + portable)
        run: npm run dist:win

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: shadowsurf-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          generate_release_notes: true
          fail_on_unmatched_files: false
